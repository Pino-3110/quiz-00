[project]
name = "quiz-00"
version = "0.1.0"
description = "Quiz 00: AI harms, mathematical fundamentals, and neural networks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assignment"
module-root = ""

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
